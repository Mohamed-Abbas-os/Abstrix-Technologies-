name: Deploy Abstrix Technologies

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK secret is missing."
            exit 1
          fi

          if [[ "$RENDER_DEPLOY_HOOK" != https://* ]]; then
            echo "ERROR: The Render Deploy Hook URL is invalid."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST "$RENDER_DEPLOY_HOOK"
